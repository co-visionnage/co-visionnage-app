# The frontend only. Data, auth, mail and notifications live in the Go
# services (../notrecinema-api, ../notrecinema-worker); run them with their
# own compose files and point API_URL at the API.
#
# Local run against an API on the host:
#   API_URL=http://host.docker.internal:8080 docker compose up --build
services:
  app:
    env_file:
      - .env
    build:
      context: .
      args:
        API_URL: ${API_URL:-http://api:8080}
    container_name: notre-cinema-app
    restart: always
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      HOSTNAME: '0.0.0.0'
      API_URL: ${API_URL:-http://api:8080}
