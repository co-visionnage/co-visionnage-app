<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Нет соединения — Наши Сериалы</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #3b82f6;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      .box {
        border: 4px solid #000;
        background: #facc15;
        box-shadow: 8px 8px 0 0 rgb(0 0 0 / 100%);
        padding: 2rem;
        max-width: 24rem;
        text-align: center;
      }
      h1 {
        font-weight: 900;
        text-transform: uppercase;
        margin: 0 0 0.75rem;
      }
      p {
        font-weight: 700;
        margin: 0 0 1.5rem;
      }
      button {
        border: 2px solid #000;
        background: #fff;
        font-weight: 900;
        padding: 0.75rem 1.5rem;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 4px 4px 0 0 rgb(0 0 0 / 100%);
      }
      button:hover {
        background: #a3e635;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Нет сети</h1>
      <p>
        Похоже, интернет пропал. Уже просмотренные постеры и страница всё ещё
        доступны — попробуй ещё раз, когда сеть вернётся.
      </p>
      <button onclick="location.reload()" type="button">Обновить</button>
    </div>
  </body>
</html>
